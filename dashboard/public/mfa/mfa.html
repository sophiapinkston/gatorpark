<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GatorPark Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Inter font (accessible, neutral), with system-ui fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- External stylesheet -->
  <link rel="stylesheet" href="../login/login.css" />
</head>
<body>
  <form method="POST" action="/mfa" class="login-form">
  <h2>Register</h2>
  <label for="code">Email</label>
  <input type="text" id="code" name="code" placeholder="Enter the code sent to your school email" required>

  <button type="submit" class="gator-btn">Submit</button>
</form>
</body>
</html>
